apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-config
data:
  AWS_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_SQS_URL: http://aws-local:4566/000000000000/togglemaster-events
  AWS_SQS_ENDPOINT_URL: http://aws-local:4566
  AWS_DYNAMODB_TABLE: ToggleMasterAnalytics
  AWS_DYNAMODB_ENDPOINT_URL: http://aws-local:4566
  AUTH_SERVICE_URL: http://auth-service:8001
  FLAG_SERVICE_URL: http://flag-service:8002
  TARGETING_SERVICE_URL: http://targeting-service:8003
  REDIS_URL: redis://redis:6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-db-init
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS api_keys (
      id SERIAL PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      key_hash VARCHAR(64) NOT NULL UNIQUE,
      is_active BOOLEAN DEFAULT true,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
  02-seed.sql: |
    INSERT INTO api_keys (name, key_hash, is_active)
    VALUES (
      'evaluation-service-local',
      '87e6c959f4118dfd606cdef341127ed1ba0251b0523993ea497f7e98d02e2f5a',
      true
    )
    ON CONFLICT (key_hash) DO NOTHING;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apps-db-init
data:
  01-init-databases.sql: |
    CREATE DATABASE flags_db;
    CREATE DATABASE targeting_db;

    \connect flags_db
    CREATE TABLE IF NOT EXISTS flags (
      id SERIAL PRIMARY KEY,
      name VARCHAR(100) UNIQUE NOT NULL,
      description TEXT,
      is_enabled BOOLEAN NOT NULL DEFAULT false,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$ BEGIN NEW.updated_at = NOW(); RETURN NEW; END; $$ LANGUAGE plpgsql;
    CREATE TRIGGER set_timestamp BEFORE UPDATE ON flags
    FOR EACH ROW EXECUTE PROCEDURE trigger_set_timestamp();

    \connect targeting_db
    CREATE TABLE IF NOT EXISTS targeting_rules (
      id SERIAL PRIMARY KEY,
      flag_name VARCHAR(100) UNIQUE NOT NULL,
      is_enabled BOOLEAN NOT NULL DEFAULT true,
      rules JSONB NOT NULL,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$ BEGIN NEW.updated_at = NOW(); RETURN NEW; END; $$ LANGUAGE plpgsql;
    CREATE TRIGGER set_timestamp BEFORE UPDATE ON targeting_rules
    FOR EACH ROW EXECUTE PROCEDURE trigger_set_timestamp();
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-local-init
data:
  init-aws.sh: |
    #!/bin/bash
    set -euo pipefail
    awslocal sqs get-queue-url --queue-name togglemaster-events >/dev/null 2>&1 || \
      awslocal sqs create-queue --queue-name togglemaster-events
    awslocal dynamodb describe-table --table-name ToggleMasterAnalytics >/dev/null 2>&1 || \
      awslocal dynamodb create-table \
        --table-name ToggleMasterAnalytics \
        --attribute-definitions AttributeName=event_id,AttributeType=S \
        --key-schema AttributeName=event_id,KeyType=HASH \
        --billing-mode PAY_PER_REQUEST
