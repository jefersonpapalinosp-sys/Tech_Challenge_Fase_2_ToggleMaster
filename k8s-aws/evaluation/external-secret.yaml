apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: evaluation-secret
  namespace: evaluation
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: evaluation-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: togglemaster/evaluation
