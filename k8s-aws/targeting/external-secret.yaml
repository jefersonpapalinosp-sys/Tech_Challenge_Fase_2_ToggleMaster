apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: targeting-secret
  namespace: targeting
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: targeting-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: togglemaster/targeting
