apiVersion: v1
kind: Secret
metadata:
  name: togglemaster-secrets
type: Opaque
stringData:
  POSTGRES_USER: "toggle"
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"
  MASTER_KEY: "CHANGE_ME_MASTER_KEY"
  SERVICE_API_KEY: "CHANGE_ME_SERVICE_API_KEY"
  AUTH_DATABASE_URL: "postgres://toggle:CHANGE_ME_POSTGRES_PASSWORD@auth-db:5432/auth_db?sslmode=disable"
  FLAGS_DATABASE_URL: "postgres://toggle:CHANGE_ME_POSTGRES_PASSWORD@apps-db:5432/flags_db"
  TARGETING_DATABASE_URL: "postgres://toggle:CHANGE_ME_POSTGRES_PASSWORD@apps-db:5432/targeting_db"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
