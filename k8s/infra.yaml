apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aws-local
spec:
  selector:
    app: aws-local
  ports:
    - name: edge
      port: 4566
      targetPort: 4566
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aws-local
  template:
    metadata:
      labels:
        app: aws-local
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.8.1
          ports:
            - containerPort: 4566
          env:
            - { name: SERVICES, value: "sqs,dynamodb" }
            - { name: AWS_DEFAULT_REGION, value: "us-east-1" }
            - { name: PERSISTENCE, value: "1" }
          readinessProbe:
            exec:
              command: ["sh", "-c", "awslocal sqs get-queue-url --queue-name togglemaster-events >/dev/null && awslocal dynamodb describe-table --table-name ToggleMasterAnalytics >/dev/null"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: init
              mountPath: /etc/localstack/init/ready.d/init-aws.sh
              subPath: init-aws.sh
            - name: data
              mountPath: /var/lib/localstack
      volumes:
        - name: init
          configMap:
            name: aws-local-init
            defaultMode: 0755
        - name: data
          emptyDir: {}
