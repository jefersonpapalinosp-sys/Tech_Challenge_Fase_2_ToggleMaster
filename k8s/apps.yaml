apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: togglemaster/auth-service:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8001 }]
          env:
            - { name: PORT, value: "8001" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: togglemaster-secrets, key: AUTH_DATABASE_URL } }
            - name: MASTER_KEY
              valueFrom: { secretKeyRef: { name: togglemaster-secrets, key: MASTER_KEY } }
          startupProbe: &authProbe
            httpGet: { path: /health, port: 8001 }
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe: *authProbe
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: &goResources
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: &appSecurity
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service }
spec:
  selector: { app: auth-service }
  ports: [{ name: http, port: 8001, targetPort: 8001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: flag-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: flag-service }
  template:
    metadata:
      labels: { app: flag-service }
    spec:
      containers:
        - name: flag-service
          image: togglemaster/flag-service:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8002 }]
          env:
            - { name: PORT, value: "8002" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: togglemaster-secrets, key: FLAGS_DATABASE_URL } }
            - name: AUTH_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: togglemaster-config, key: AUTH_SERVICE_URL } }
          startupProbe: &flagProbe
            httpGet: { path: /health, port: 8002 }
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe: *flagProbe
          livenessProbe:
            httpGet: { path: /health, port: 8002 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: &pythonResources
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: flag-service }
spec:
  selector: { app: flag-service }
  ports: [{ name: http, port: 8002, targetPort: 8002 }]
