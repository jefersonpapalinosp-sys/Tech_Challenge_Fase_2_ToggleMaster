apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-init
  namespace: auth
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-db-init
        app.kubernetes.io/part-of: togglemaster
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /sql/init.sql'
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: sql
          configMap:
            name: auth-db-init
