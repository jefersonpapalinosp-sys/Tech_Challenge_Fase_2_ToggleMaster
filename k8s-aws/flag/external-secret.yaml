apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flag-secret
  namespace: flag
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: flag-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: togglemaster/flag
